name: Build IPA
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - run: xcodebuild -downloadPlatform iOS
      - name: Build unsigned
        run: |
          xcodebuild -project Moonlight.xcodeproj -scheme Moonlight -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/Moonlight.app Payload/
          zip -qr Moonlight-mouse.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Moonlight-mouse-ipa
          path: Moonlight-mouse.ipa
